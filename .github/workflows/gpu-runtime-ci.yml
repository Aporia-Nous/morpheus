name: Morpheus GPU Runtime CI

on:
  push:
    branches:
      - feature/gpu-runtime-v0.1
  pull_request:
    branches:
      - main

jobs:
  gpu-surface:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate existing Morpheus tests
        run: |
          node test.js
          node conformance.js

      - name: Validate GPU runtime surface without CUDA
        run: node gpu_test.js

      - name: Show CUDA build dry run
        run: node gpu_build.js examples/gpu_compute.morph --arch sm_89 --dry-run
